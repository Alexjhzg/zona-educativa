[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
exclude = ["venv", ".venv", "__pycache__", "backups"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "app"]
addopts = "-v"

