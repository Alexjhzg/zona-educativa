services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: zona_educativa_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zona_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zona_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-zona_educativa_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zona_user -d zona_educativa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zona_educativa_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://zona_user:zona_pass_2026@db:5432/zona_educativa_db
      XLSM_PATH: /app/PLANTELES EDUCATIVOS - copia.xlsm
    volumes:
      - "./backend:/app"
      - "./PLANTELES EDUCATIVOS - copia.xlsm:/app/PLANTELES EDUCATIVOS - copia.xlsm"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python app/seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Frontend Vue 3 + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zona_educativa_frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - "./frontend/dist:/usr/share/nginx/html"
      - "./frontend/nginx.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      - backend

volumes:
  postgres_data:
